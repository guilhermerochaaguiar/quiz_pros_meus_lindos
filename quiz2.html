<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioQuiz</title>

    <link rel="stylesheet" href="quiz2.css">
</head>
<body>

    <div class="container">

        <div id="home">
            <h1>BioQuiz</h1>

            <p>
                Teste pro Anderson e Amandinha
            </p>

            <button onclick="startQuiz()">
                Começar Quiz
            </button>
        </div>

        <div id="quiz">
            <h2 id="question"></h2>
            <div id="options"></div>
        </div>

        <div id="result">
            <h2>Resultado</h2>

            <p id="score"></p>

            <button onclick="location.reload()">
                Refazer Quiz
            </button>
        </div>

    </div>

    <script src="quiz.js"></script>

</body>
</html>
